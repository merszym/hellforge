{% extends 'main/base.html' %} 
{% load static %}
{% block head %}
<title>Hellforge</title>
{% endblock %} 
{% block paddingless %}
<div class="hero bg-primary">
  <div class="hero-body">
    <h1 style="margin: 0px">Hellforge</h1>
    <p>Helpfully Labeled Layers (for Geneticists)</p>
  </div>
</div>
{% endblock %} 
{% block body %}
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
  <a href="{% url 'site_list' %}" class="btn-link" style="width: 300px;display: block;">
    <div class="card p-2">
      <div class="card-image p-2" style="margin: auto;">
        <img src="{% static 'img/svg/layer.svg' %}" height="100px">
      </div>
      <div class="card-body">
        <h5 class="text-dark text-center">All Sites</h5>
      </div>  
    </div>
  </a>
  <a href="{% url 'culture_list' %}" class="btn-link" style="width: 300px; display: block;">
    <div class="card p-2">
      <div class="card-image p-2" style="margin: auto;">
        <img src="{% static 'img/svg/culture.svg' %}" height="100px">
      </div>
      <div class="card-body">
        <h5 class="text-dark text-center">All Cultures</h5>
      </div>  
    </div>
  </a>
  <!-- the results of the samples of selected projects on a map and a timeline -->
  <a href="{% url 'main_results_map' %}" class="btn-link" style="width: 300px; display: block;">
    <div class="card p-2">
      <div class="card-image p-2" style="margin: auto;">
        <svg height="100" viewBox="0 0 24 24" fill="none" stroke="#3b4351" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3 3 5.5v15L9 18l6 2.5 6-2.5V3l-6 2.5z"/><path d="M9 3v15M15 5.5v15"/>
          <circle cx="12" cy="10" r="2.2" fill="#5755d9" stroke="#5755d9"/>
        </svg>
      </div>
      <div class="card-body">
        <h5 class="text-dark text-center">All Results</h5>
      </div>  
    </div>
  </a>
</div>

{% endblock %}
