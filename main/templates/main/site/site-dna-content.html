{% load format %}

<ul class="tab" id="DNA-list">
    <li id="DNA-tab_AA75" class="tab-item active DNA"
        data-group="DNA-tab"
        data-show="DNA-tab_AA75-content"
        data-object="AA75"
        data-analysis="quicksand">
        <a style="cursor:pointer;">Mammalian mtDNA</a>
    </li>
    <li id="DNA-tab_AA163" class="tab-item DNA"
        data-group="DNA-tab"
        data-show="DNA-tab_AA163-content"
        data-object="AA163"
        data-analysis="matthias">
        <a style="cursor:pointer;">Hominin mtDNA</a>
    </li>
    <li id="DNA-tab_NedFlow" class="tab-item DNA"
        data-group="DNA-tab"
        data-show="DNA-tab_NedFlow-content"
        data-object="NedFlow"
        data-analysis="nedflow">
        <a style="cursor:pointer;">Vertebrate Nuclear DNA</a>
    </li>
    <script>
    $('body').off('click.dnatab').on('click.dnatab', '.DNA', function(){
        add_url_params({
            'DNA-tab':$(this).attr("data-object")
        })
        // the side-panel shows the settings of this analysis
        $('#dna-layout').attr('data-analysis', $(this).attr('data-analysis'))
        dnaRefreshStale(document.getElementById($(this).attr('data-show')))
    })
    // the sub-tabs of the Mammalian mtDNA tab (quicksand, clades)
    $('body').off('click.mammaltab').on('click.mammaltab', '.Mammal', function(){
        dnaRefreshStale(document.getElementById($(this).attr('data-show')))
    })
    // reload the shown table(s), if the filters changed while it was hidden
    function dnaRefreshStale(panel){
        if(!panel){ return }
        [panel].concat(Array.from(panel.querySelectorAll('.dna-analysis-panel'))).forEach(function(table){
            if(table.dataset.stale && table.offsetParent !== null){
                delete table.dataset.stale
                htmx.trigger(table, 'dna-refresh')
            }
        })
    }
    </script>
</ul>

<!-- the analysis tables: loaded when shown, reloaded (dna-refresh) when the filters change -->
<!-- Mammalian mtDNA: quicksand and (if there are clade results) the clades of single families, both with the quicksand settings -->
<div class="my-2 tab-panel" id="DNA-tab_AA75-content" data-group="DNA-tab">
    {% if has_clades %}
    <ul class="tab">
        <li class="tab-item active Mammal" data-group="Mammal-tab" data-show="site_dna_content"><a style="cursor:pointer;">quicksand</a></li>
        <li class="tab-item Mammal" data-group="Mammal-tab" data-show="site_clade_content"><a style="cursor:pointer;">Clades</a></li>
    </ul>
    {% endif %}
    <div class="panel tab-panel dna-analysis-panel" id="site_dna_content" data-group="Mammal-tab" data-analysis="quicksand"
        hx-get="{% url 'main_site_getquicksand' object.pk %}" hx-trigger="load once, dna-refresh">
        <div class="loading loading-lg m-2"></div>
    </div>
    {% if has_clades %}
    <div style="display: none;" class="panel tab-panel dna-analysis-panel" id="site_clade_content" data-group="Mammal-tab" data-analysis="quicksand"
        hx-get="{% url 'main_site_getclades' object.pk %}" hx-trigger="intersect once, dna-refresh">
        <div class="loading loading-lg m-2"></div>
    </div>
    {% endif %}
</div>

<div style="display: none;" class="my-2 panel tab-panel dna-analysis-panel" id="DNA-tab_AA163-content" data-group="DNA-tab" data-analysis="matthias"
    hx-get="{% url 'main_site_getmatthias' object.pk %}" hx-trigger="intersect once, dna-refresh">
    <div class="loading loading-lg m-2"></div>
</div>

<div style="display: none;" class="my-2 panel tab-panel dna-analysis-panel" id="DNA-tab_NedFlow-content" data-group="DNA-tab" data-analysis="nedflow"
    hx-get="{% url 'main_site_getnedflow' object.pk %}" hx-trigger="intersect once, dna-refresh">
    <div class="loading loading-lg m-2"></div>
</div>
