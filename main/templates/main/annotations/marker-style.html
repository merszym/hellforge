{# the markers of the samples (dots, pie-charts, labels) and the legend: the image viewer and the 3d-view #}
<style>
    .annotation-marker { background: none; border: none; }
    .annotation-marker .dot { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%;
        border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); }
    .annotation-marker .dot:not(.layer-dot) { background: #5755d9; }
    .annotation-marker .label { position: absolute; left: 9px; top: -10px; white-space: nowrap; font-size: .7rem; font-weight: 600;
        background: rgba(255,255,255,.85); padding: 0 .25rem; border-radius: .15rem; }
    .annotation-marker.focus .dot { width: 18px; height: 18px; left: -9px; top: -9px; }
    .annotation-marker.focus .dot:not(.layer-dot) { background: #e85600; }
    /* samples: the color of the culture of the layer of origin (css-classes of the site page), without layer: white */
    /* the size is set with the slider (--dot-size on the map), black outline */
    .annotation-marker .dot.layer-dot { width: var(--dot-size, 12px); height: var(--dot-size, 12px);
        left: calc(var(--dot-size, 12px) / -2); top: calc(var(--dot-size, 12px) / -2); border: 1px solid #000; }
    .annotation-marker .dot.layer-dot.no-layer { background: #fff; }
    .annotation-marker.focus .dot.layer-dot { width: calc(var(--dot-size, 12px) * 1.5); height: calc(var(--dot-size, 12px) * 1.5);
        left: calc(var(--dot-size, 12px) * -.75); top: calc(var(--dot-size, 12px) * -.75); border: 2px solid #e85600; }
    .annotation-marker .layer-dot ~ .label { left: calc(var(--dot-size, 12px) / 2 + 3px); }
    .annotation-marker.focus .layer-dot ~ .label { left: calc(var(--dot-size, 12px) * .75 + 3px); }
    /* results: pie-chart (families/lineages), white dot (analyzed, no family/not ancient), dark ring (hominin: ancient,
       no significant lineage), grey dot (no results) */
    /* the size of the pie-charts is set with the slider (--pie-size on the map) */
    .annotation-marker .pie { position: absolute; width: var(--pie-size, 32px); height: var(--pie-size, 32px);
        left: calc(var(--pie-size, 32px) / -2); top: calc(var(--pie-size, 32px) / -2); border-radius: 50%;
        border: 1px solid #000; box-shadow: 0 0 3px rgba(0,0,0,.7); }
    .annotation-marker .pie svg { width: 100%; height: 100%; display: block; }
    .annotation-marker .pie line { stroke: #000; stroke-width: .5px; vector-effect: non-scaling-stroke; }
    .annotation-marker .pie ~ .label { left: calc(var(--pie-size, 32px) / 2 + 2px); }
    .annotation-marker .ring { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
        border: 4px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.7), inset 0 0 2px rgba(0,0,0,.7); }
    /* no results: grey with a dark outline, not ancient (no ancient family): white with a dark outline */
    .annotation-marker .dot.none { background: #9a9a9a; border-color: #555; box-shadow: none; }
    .annotation-marker .dot.none.not-ancient { background: #fff; }
    .annotation-marker.focus .dot.none { border-color: #e85600; }
    .annotation-marker .ring.ns { border-color: #222; box-shadow: 0 0 2px #fff, inset 0 0 2px #fff; }
    .annotation-marker.focus .pie, .annotation-marker.focus .ring { border-color: #e85600; }
    .hide-labels .annotation-marker .label { display: none; }
    [id^=annotation-info-].active { color: #fff; background: #5755d9; border-radius: 50%; }
    .annotation-legend { background: rgba(255,255,255,.92); padding: .3rem .5rem; border-radius: .2rem; font-size: .7rem;
        box-shadow: 0 0 3px rgba(0,0,0,.4); max-height: 50vh; overflow-y: auto; }
    .annotation-legend .culture-swatch { border: 1px solid #000; box-sizing: border-box; }
    .annotation-legend .culture-swatch.no-layer { background: #fff; }
    .annotation-legend .swatch { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .3rem; vertical-align: middle; }
    .annotation-popup td { padding: 0 .4rem 0 0; font-size: .7rem; }
</style>
